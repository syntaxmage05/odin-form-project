<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin Sign Up Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="img-container">
      <img src="img/odin.jpg" class="container-img" alt="Green leaves">
      <div class="img-body">
        <div class="logo">
          <img src="img/odin-lined.png" class= "odin-logo" alt="">
          <p>Odin</p>
        </div>
      </div>
      <div class="img-paragraph">
        <p>Photo by <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
      </div>
    </div>
    <div class="form-container">
      <h3>
        This is not a real online service! You know you need something
        like this in your life to help you realize your deepest dreams.
        Sign up <em>now</em> to get started.
      </h3>
      <h3>
        You <em>Know</em> you want to.
      </h3>

      <form action="">
        <h3>Let's do this!</h3>
        <div class="form">
          <div class="track-rows">
            <label for="first_name">FIRST NAME</label>
            <input type="text" name="first_name" id="first_name">
          </div>

          <div class="track-rows">
            <label for="last_name">LAST NAME</label>
            <input type="text" name="last_name" id="last_name">
          </div>

          <div class="track-rows">
            <label for="mail">EMAIL</label>
            <input type="email" name="mail" id="mail">
          </div>

          <div class="track-rows">
            <label for="tel_number">PHONE NUMBER</label>
            <input type="tel" name="tel_number" id="tel_number">
          </div>

          <div class="track-rows">
            <label for="password">PASSWORD</label>
            <input type="password" name="password" id="password" required>
          </div>

          <div class="track-rows">
            <label for="password_confirmation">CONFIRM PASSWORD</label>
            <input type="password" name="password_confirmation" id="password_confirmation" required>
          </div>

        </div>
        <button class="create-account" type="submit">
          Create Account
        </button>

        <div class="login">
          <p>Already have an account?</p>
          <a href="">Log in</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
